[package]
name = "devworkstation"
version = "0.1.0"
description = "DevWorkstation - an offline-first developer workstation"
authors = ["Derrick"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Local application database (SQLite is compiled in - no server install required)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Password hashing for the local login
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc"] }
rand_core = { version = "0.6", features = ["std"] }

# OS-native secure credential storage (Windows Credential Manager / Keychain / libsecret)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# Networking for Website Lab
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net"] }
url = "2"

# Filesystem + code analysis
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# PDF engine
lopdf = "0.32"
printpdf = { version = "0.7", features = ["embedded_images"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.32"
sha2 = "0.10"
hex = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
