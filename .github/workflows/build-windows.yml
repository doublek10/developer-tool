name: Build Windows installer

# This is what actually produces DevWorkstation-Setup.exe. It runs on
# GitHub's own windows-latest runner, which has a current Rust toolchain,
# the MSVC linker, and everything else Tauri needs on Windows — none of
# which can be produced from a Linux sandbox. You do not need Rust, Node,
# or anything else installed on your own machine to use this.
#
# HOW TO USE:
#   1. Push this repo to GitHub (public or private, either works).
#   2. Go to the "Actions" tab -> "Build Windows installer" -> "Run workflow".
#      (It also runs automatically on every push to main, and on tags
#      starting with "v", e.g. v0.1.0.)
#   3. When it finishes (5-10 minutes), open the workflow run and download
#      the "DevWorkstation-Setup" artifact at the bottom of the page. That
#      zip contains DevWorkstation-Setup.exe. Unzip it and run it.
#
# Unsigned by default, so Windows SmartScreen and Edge's download check
# will warn on first run/download ("Unknown publisher", "isn't commonly
# downloaded"). That warning is about Authenticode code signing (a paid
# certificate, or Microsoft Store/MSIX) — it is NOT what
# TAURI_SIGNING_PRIVATE_KEY below is for. That secret only signs Tauri's
# *updater* packages (proves an auto-update came from you); it has no
# effect on the SmartScreen warning. See "Windows trust warnings" in
# README.md for what actually removes it, and what's free to do for now.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Optional code signing: only runs if you've added the three secrets
      # below in your repo's Settings -> Secrets and variables -> Actions.
      # Leave them unset and the build still works, just unsigned.
      - name: Build installer (signed)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build installer (unsigned)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DevWorkstation-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Publishes the signed-or-not installer as a GitHub Release asset,
      # only on version tags (v0.1.0, v0.2.0, ...). This is a free lever
      # for the "isn't commonly downloaded" / SmartScreen banner: Edge and
      # SmartScreen weigh the *source* domain's reputation too, and
      # github.com already has a strong one, unlike a brand-new custom
      # domain. It's not a substitute for signing — just something that
      # costs nothing and helps while you save up for a certificate.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
